<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draguz // Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --void:#0A0D12; --panel:#12161F; --panel-2:#181D28; --line:#2A3140;
    --gold:#C9A227; --gold-dim:#8A7222; --brick:#A8433A; --ok:#4C8B6B; --amber:#C77B2E;
    --text:#EDE9DD; --text-dim:#8B8F9C; --text-faint:#565B68; --radius:2px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ background:var(--void); color:var(--text); font-family:'Inter',sans-serif; width:100%; min-height:100vh; }
  .wrap{ max-width:1300px; margin:0 auto; padding:28px 32px 60px; }
  header{ display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid var(--line); padding-bottom:16px; margin-bottom:24px; flex-wrap:wrap; gap:14px; }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand-mark{ width:40px; height:40px; border:2px solid var(--gold); display:flex; align-items:center; justify-content:center;
    font-family:'Oswald',sans-serif; font-weight:700; font-size:15px; color:var(--gold); transform:rotate(-3deg); }
  .brand h1{ font-family:'Oswald',sans-serif; font-weight:600; font-size:24px; letter-spacing:1px; text-transform:uppercase; }
  .brand span{ display:block; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-dim); letter-spacing:2px; margin-top:5px; text-transform:uppercase; }
  .navlink{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--gold-dim); text-decoration:none; letter-spacing:1px; text-transform:uppercase; border:1px solid var(--line); padding:8px 14px; border-radius:var(--radius); }
  .navlink:hover{ border-color:var(--gold); color:var(--gold); }

  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:22px; }
  .stat{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px 16px; }
  .stat-label{ font-family:'JetBrains Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-faint); }
  .stat-value{ font-family:'Oswald',sans-serif; font-size:22px; font-weight:600; margin-top:4px; }

  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
  .btn{ font-family:'Inter',sans-serif; font-weight:600; font-size:13px; border:1px solid var(--line); background:var(--panel);
    color:var(--text); padding:10px 18px; border-radius:var(--radius); cursor:pointer; transition:all .15s ease; }
  .btn:hover{ border-color:var(--gold); color:var(--gold); }
  .btn.primary{ background:var(--gold); color:var(--void); border-color:var(--gold); }
  .btn.primary:hover{ background:#DBB93A; }
  .btn.ghost{ background:transparent; }
  .tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .tab{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; padding:9px 16px;
    border:1px solid var(--line); background:var(--panel); color:var(--text-dim); cursor:pointer; border-radius:var(--radius); }
  .tab.active{ border-color:var(--gold); color:var(--gold); }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
  .pcard{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
  .pcard-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:4px; }
  .pcard h3{ font-family:'Oswald',sans-serif; font-size:15px; text-transform:uppercase; letter-spacing:.5px; }
  .pcard .cat{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1px; }
  .pcard .price{ font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--gold); }
  .pcard-actions{ display:flex; gap:6px; }
  .icon-btn{ background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:13px; padding:2px 4px; }
  .icon-btn:hover{ color:var(--gold); }
  .icon-btn.danger:hover{ color:var(--brick); }

  .variant-row{ display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px dashed var(--line); }
  .variant-row:first-of-type{ border-top:none; margin-top:8px; }
  .variant-info{ flex:1; font-size:12.5px; }
  .variant-info b{ color:var(--text); }
  .variant-stock{ font-family:'JetBrains Mono',monospace; font-size:13px; min-width:30px; text-align:center; }
  .variant-stock.zero{ color:var(--brick); }
  .stockbtn{ width:22px; height:22px; border:1px solid var(--line); background:var(--void); color:var(--text-dim); border-radius:var(--radius); cursor:pointer; font-size:12px; }
  .stockbtn:hover{ border-color:var(--gold); color:var(--gold); }
  .sellbtn{ font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--gold-dim);
    background:none; border:1px solid var(--gold-dim); padding:4px 8px; border-radius:var(--radius); cursor:pointer; }
  .sellbtn:hover{ border-color:var(--gold); color:var(--gold); }

  .saleslist{ display:flex; flex-direction:column; gap:8px; }
  .sale-row{ display:flex; justify-content:space-between; align-items:center; background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--gold);
    border-radius:var(--radius); padding:10px 14px; font-size:13px; }
  .sale-row .meta{ color:var(--text-dim); font-size:11.5px; font-family:'JetBrains Mono',monospace; }
  .sale-row .total{ font-family:'JetBrains Mono',monospace; color:var(--gold); font-weight:600; }

  .overlay{ position:fixed; inset:0; background:rgba(6,8,12,0.75); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .overlay.open{ display:flex; }
  .modal{ background:var(--panel); border:1px solid var(--line); width:100%; max-width:440px; border-radius:var(--radius); padding:24px; border-top:3px solid var(--gold); max-height:88vh; overflow-y:auto; }
  .modal h3{ font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:1px; font-size:17px; margin-bottom:16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); margin-bottom:6px; }
  .field input, .field select{ width:100%; background:var(--void); border:1px solid var(--line); color:var(--text); padding:9px 10px; border-radius:var(--radius); font-family:'Inter',sans-serif; font-size:13.5px; }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--gold); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row3{ display:grid; grid-template-columns:1.4fr 1fr 0.8fr auto; gap:6px; align-items:center; margin-bottom:6px; }
  .modal-actions{ display:flex; justify-content:space-between; margin-top:20px; }
  .add-row-btn{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--gold-dim); background:none; border:1px dashed var(--line); padding:7px; width:100%; border-radius:var(--radius); cursor:pointer; margin-top:4px; }
  .add-row-btn:hover{ border-color:var(--gold); color:var(--gold); }

  .status-line{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-faint); text-align:center; margin-top:30px; }
  .status-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--ok); margin-right:6px; vertical-align:middle; }
  .toast{ position:fixed; bottom:24px; right:24px; background:var(--panel); border:1px solid var(--gold); border-left:3px solid var(--gold);
    padding:12px 18px; border-radius:var(--radius); font-size:13px; font-weight:600; z-index:100; transform:translateY(20px); opacity:0; transition:all .3s ease; pointer-events:none; }
  .toast.show{ transform:translateY(0); opacity:1; }
  .empty{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-faint); text-align:center; padding:40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-mark">DZ</div>
      <div>
        <h1>Inventario</h1>
        <span>Draguz Shop</span>
      </div>
    </div>
    <a class="navlink" href="index.html">← Panel de tareas</a>
  </header>

  <div class="stats">
    <div class="stat"><div class="stat-label">Productos</div><div class="stat-value" id="statProducts">0</div></div>
    <div class="stat"><div class="stat-label">Piezas en stock</div><div class="stat-value" id="statStock">0</div></div>
    <div class="stat"><div class="stat-label">Ventas hoy</div><div class="stat-value" id="statSalesToday">0</div></div>
    <div class="stat"><div class="stat-label">Ingresos hoy</div><div class="stat-value" id="statRevenueToday">$0</div></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="productos" id="tabProductos">Productos</div>
    <div class="tab" data-tab="ventas" id="tabVentas">Historial de ventas</div>
  </div>

  <div id="viewProductos">
    <div class="toolbar">
      <button class="btn primary" id="btnAddProduct">+ Nuevo producto</button>
    </div>
    <div class="grid" id="productGrid"></div>
  </div>

  <div id="viewVentas" style="display:none;">
    <div class="saleslist" id="salesList"></div>
  </div>

  <div class="status-line" id="statusLine">conectando...</div>
</div>

<div class="toast" id="toast"></div>

<!-- Modal producto -->
<div class="overlay" id="productOverlay">
  <div class="modal">
    <h3 id="productModalTitle">Nuevo producto</h3>
    <input type="hidden" id="pId">
    <div class="field"><label>Nombre</label><input type="text" id="pName" placeholder="Ej. Playera Oversize Galaxy"></div>
    <div class="row2">
      <div class="field"><label>Categoría</label><input type="text" id="pCategory" placeholder="Ej. Playera / Hoodie"></div>
      <div class="field"><label>Precio</label><input type="number" id="pPrice" placeholder="450" step="0.01"></div>
    </div>
    <div class="field">
      <label>Variantes (talla / color / stock)</label>
      <div id="variantEditList"></div>
      <button type="button" class="add-row-btn" id="btnAddVariantRow">+ Agregar variante</button>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="btnDeleteProduct" style="display:none; color:var(--brick); border-color:var(--brick);">Eliminar</button>
      <div style="display:flex; gap:10px; margin-left:auto;">
        <button class="btn ghost" id="btnCancelProduct">Cancelar</button>
        <button class="btn primary" id="btnSaveProduct">Guardar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal venta -->
<div class="overlay" id="saleOverlay">
  <div class="modal">
    <h3>Registrar venta</h3>
    <div class="field" id="saleInfo"></div>
    <div class="field"><label>Cantidad</label><input type="number" id="saleQty" value="1" min="1"></div>
    <div class="modal-actions">
      <div style="display:flex; gap:10px; margin-left:auto;">
        <button class="btn ghost" id="btnCancelSale">Cancelar</button>
        <button class="btn primary" id="btnConfirmSale">Confirmar venta</button>
      </div>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAnQ7e2iQ-cKyUB3xOoL4Yim0FWy1GqvME",
  authDomain: "tareas-paulo.firebaseapp.com",
  databaseURL: "https://tareas-paulo-default-rtdb.firebaseio.com",
  projectId: "tareas-paulo",
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const invRef = firebase.database().ref('draguz-inventory-v1');

let data = { products: [], sales: [] };
let editingVariants = [];
let pendingSale = null; // { productId, variantId }

function uid(p){ return p + '_' + Date.now() + '_' + Math.floor(Math.random()*1000); }
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function money(n){ return '$' + Number(n||0).toLocaleString('es-MX', {maximumFractionDigits:0}); }
function modalsOpen(){ return document.getElementById('productOverlay').classList.contains('open') || document.getElementById('saleOverlay').classList.contains('open'); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 2200);
}
function setStatus(msg, ok){
  document.getElementById('statusLine').innerHTML = `<span class="status-dot" style="background:${ok?'var(--ok)':'var(--brick)'}"></span>${msg}`;
}
async function saveData(){
  try{ await invRef.set(data); setStatus('sincronizado · ' + new Date().toLocaleTimeString('es-MX'), true); }
  catch(e){ setStatus('error al guardar', false); }
}

invRef.on('value', (snap)=>{
  const val = snap.val();
  if(val && val.products){ data = val; if(!data.sales) data.sales = []; }
  else { invRef.set(data); }
  setStatus('en vivo · ' + new Date().toLocaleTimeString('es-MX'), true);
  if(!modalsOpen()) render();
}, ()=> setStatus('sin conexión a Firebase', false));

function renderStats(){
  const totalStock = data.products.reduce((sum,p)=> sum + p.variants.reduce((s,v)=>s+Number(v.stock||0),0), 0);
  const today = todayStr();
  const salesToday = data.sales.filter(s=>s.date.slice(0,10)===today);
  const revenueToday = salesToday.reduce((s,x)=>s+Number(x.total||0),0);
  document.getElementById('statProducts').textContent = data.products.length;
  document.getElementById('statStock').textContent = totalStock;
  document.getElementById('statSalesToday').textContent = salesToday.reduce((s,x)=>s+Number(x.qty||0),0);
  document.getElementById('statRevenueToday').textContent = money(revenueToday);
}

function render(){
  renderStats();
  renderProducts();
  renderSales();
}

function renderProducts(){
  const grid = document.getElementById('productGrid');
  if(data.products.length===0){ grid.innerHTML = '<div class="empty">Sin productos todavía. Agrega el primero.</div>'; return; }
  grid.innerHTML = '';
  data.products.forEach(p=>{
    const card = document.createElement('div');
    card.className = 'pcard';
    card.innerHTML = `
      <div class="pcard-top">
        <div>
          <h3>${escapeHtml(p.name)}</h3>
          <div class="cat">${escapeHtml(p.category||'—')}</div>
        </div>
        <div class="pcard-actions">
          <button class="icon-btn" data-action="editp" data-id="${p.id}" title="Editar">✎</button>
        </div>
      </div>
      <div class="price">${money(p.price)}</div>
      ${p.variants.map(v=>`
        <div class="variant-row">
          <div class="variant-info"><b>${escapeHtml(v.talla)}</b> · ${escapeHtml(v.color)}</div>
          <button class="stockbtn" data-action="stockdown" data-pid="${p.id}" data-vid="${v.id}">−</button>
          <span class="variant-stock ${Number(v.stock)===0?'zero':''}">${v.stock}</span>
          <button class="stockbtn" data-action="stockup" data-pid="${p.id}" data-vid="${v.id}">+</button>
          <button class="sellbtn" data-action="sell" data-pid="${p.id}" data-vid="${v.id}">Vender</button>
        </div>
      `).join('')}
    `;
    grid.appendChild(card);
  });

  grid.querySelectorAll('[data-action=editp]').forEach(btn=>{
    btn.addEventListener('click', ()=> openProductModal(data.products.find(p=>p.id===btn.dataset.id)) );
  });
  grid.querySelectorAll('[data-action=stockup],[data-action=stockdown]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const p = data.products.find(p=>p.id===btn.dataset.pid);
      const v = p.variants.find(v=>v.id===btn.dataset.vid);
      const delta = btn.dataset.action==='stockup' ? 1 : -1;
      v.stock = Math.max(0, Number(v.stock||0) + delta);
      await saveData(); render();
    });
  });
  grid.querySelectorAll('[data-action=sell]').forEach(btn=>{
    btn.addEventListener('click', ()=> openSaleModal(btn.dataset.pid, btn.dataset.vid) );
  });
}

function renderSales(){
  const list = document.getElementById('salesList');
  const sorted = [...data.sales].sort((a,b)=> b.date.localeCompare(a.date));
  if(sorted.length===0){ list.innerHTML = '<div class="empty">Todavía no hay ventas registradas.</div>'; return; }
  list.innerHTML = sorted.slice(0,100).map(s=>`
    <div class="sale-row">
      <div>
        <div>${escapeHtml(s.productName)} <span class="meta">${escapeHtml(s.variantLabel)}</span></div>
        <div class="meta">${new Date(s.date).toLocaleString('es-MX', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})} · x${s.qty}</div>
      </div>
      <div class="total">${money(s.total)}</div>
    </div>
  `).join('');
}

/* ===== MODAL PRODUCTO ===== */
function renderVariantEditList(){
  const box = document.getElementById('variantEditList');
  box.innerHTML = editingVariants.map((v,i)=>`
    <div class="row3" data-i="${i}">
      <input type="text" placeholder="Talla" value="${escapeHtml(v.talla)}" data-role="talla">
      <input type="text" placeholder="Color" value="${escapeHtml(v.color)}" data-role="color">
      <input type="number" placeholder="Stock" value="${v.stock}" data-role="stock" min="0">
      <button type="button" class="icon-btn danger" data-role="del">✕</button>
    </div>
  `).join('');
  box.querySelectorAll('.row3').forEach(row=>{
    const i = +row.dataset.i;
    row.querySelector('[data-role=talla]').addEventListener('input', e=> editingVariants[i].talla = e.target.value);
    row.querySelector('[data-role=color]').addEventListener('input', e=> editingVariants[i].color = e.target.value);
    row.querySelector('[data-role=stock]').addEventListener('input', e=> editingVariants[i].stock = e.target.value);
    row.querySelector('[data-role=del]').addEventListener('click', ()=>{ editingVariants.splice(i,1); renderVariantEditList(); });
  });
}

function openProductModal(p){
  document.getElementById('productModalTitle').textContent = p ? 'Editar producto' : 'Nuevo producto';
  document.getElementById('pId').value = p ? p.id : '';
  document.getElementById('pName').value = p ? p.name : '';
  document.getElementById('pCategory').value = p ? (p.category||'') : '';
  document.getElementById('pPrice').value = p ? p.price : '';
  editingVariants = p ? JSON.parse(JSON.stringify(p.variants)) : [{ id: uid('var'), talla:'', color:'', stock:0 }];
  renderVariantEditList();
  document.getElementById('btnDeleteProduct').style.display = p ? 'inline-block' : 'none';
  document.getElementById('productOverlay').classList.add('open');
  document.getElementById('pName').focus();
}
function closeProductModal(){ document.getElementById('productOverlay').classList.remove('open'); }

async function saveProduct(){
  const name = document.getElementById('pName').value.trim();
  if(!name) return;
  const id = document.getElementById('pId').value;
  const cleanVariants = editingVariants
    .filter(v=>v.talla.trim()!=='' || v.color.trim()!=='')
    .map(v=>({ id: v.id || uid('var'), talla: v.talla.trim(), color: v.color.trim(), stock: Math.max(0, Number(v.stock)||0) }));
  const payload = {
    name,
    category: document.getElementById('pCategory').value.trim(),
    price: Number(document.getElementById('pPrice').value) || 0,
    variants: cleanVariants,
  };
  if(id){ Object.assign(data.products.find(p=>p.id===id), payload); }
  else { data.products.push({ id: uid('prod'), ...payload }); }
  await saveData();
  closeProductModal();
  render();
  showToast(id ? 'Producto actualizado' : 'Producto agregado');
}

/* ===== MODAL VENTA ===== */
function openSaleModal(pid, vid){
  const p = data.products.find(p=>p.id===pid);
  const v = p.variants.find(v=>v.id===vid);
  pendingSale = { productId: pid, variantId: vid };
  document.getElementById('saleInfo').innerHTML = `<label>Producto</label><div style="font-size:14px; padding:6px 0;">${escapeHtml(p.name)} — ${escapeHtml(v.talla)} / ${escapeHtml(v.color)} <span style="color:var(--text-dim); font-family:'JetBrains Mono',monospace; font-size:11px;">(${v.stock} disponibles)</span></div>`;
  document.getElementById('saleQty').value = 1;
  document.getElementById('saleQty').max = v.stock;
  document.getElementById('saleOverlay').classList.add('open');
}
function closeSaleModal(){ document.getElementById('saleOverlay').classList.remove('open'); pendingSale=null; }

async function confirmSale(){
  if(!pendingSale) return;
  const p = data.products.find(p=>p.id===pendingSale.productId);
  const v = p.variants.find(v=>v.id===pendingSale.variantId);
  const qty = Math.max(1, Number(document.getElementById('saleQty').value)||1);
  if(qty > Number(v.stock)){ alert('No hay suficiente stock para esa cantidad.'); return; }
  v.stock = Number(v.stock) - qty;
  data.sales.push({
    id: uid('sale'), productId: p.id, variantId: v.id,
    productName: p.name, variantLabel: `${v.talla} / ${v.color}`,
    qty, total: qty * Number(p.price||0), date: new Date().toISOString(),
  });
  await saveData();
  closeSaleModal();
  render();
  showToast('Venta registrada');
}

document.getElementById('btnAddProduct').addEventListener('click', ()=>openProductModal(null));
document.getElementById('btnCancelProduct').addEventListener('click', closeProductModal);
document.getElementById('btnSaveProduct').addEventListener('click', saveProduct);
document.getElementById('btnAddVariantRow').addEventListener('click', ()=>{
  editingVariants.push({ id: uid('var'), talla:'', color:'', stock:0 });
  renderVariantEditList();
});
document.getElementById('btnDeleteProduct').addEventListener('click', async ()=>{
  const id = document.getElementById('pId').value;
  if(id && confirm('¿Eliminar este producto?')){
    data.products = data.products.filter(p=>p.id!==id);
    await saveData(); closeProductModal(); render(); showToast('Eliminado');
  }
});
document.getElementById('btnCancelSale').addEventListener('click', closeSaleModal);
document.getElementById('btnConfirmSale').addEventListener('click', confirmSale);
document.getElementById('productOverlay').addEventListener('click', e=>{ if(e.target.id==='productOverlay') closeProductModal(); });
document.getElementById('saleOverlay').addEventListener('click', e=>{ if(e.target.id==='saleOverlay') closeSaleModal(); });

document.getElementById('tabProductos').addEventListener('click', ()=>{
  document.getElementById('tabProductos').classList.add('active');
  document.getElementById('tabVentas').classList.remove('active');
